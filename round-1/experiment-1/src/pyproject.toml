[project]
name = "lane-a-safety-harvest"
version = "1.0.0"
description = "Lane A: one teacher-forced activation harvest of a Qwen3-4B fine-tuning lineage, five candidate single-model safety readouts, four baselines and a pre-registered specificity screen"
requires-python = ">=3.12"
# Every version below is the EXACT version resolved into .venv on 2026-09-20, captured with
# `uv pip freeze --python .venv/bin/python` (a verbatim copy lives at work/pip_freeze.txt).
#
# NOTE ON torch: the pin carries the local version segment `+cu124` and therefore resolves
# only from the PyTorch CUDA 12.4 index, not from PyPI. Install it first with
#   uv pip install --python=.venv/bin/python torch==2.6.0+cu124 \
#     --index-url https://download.pytorch.org/whl/cu124 --index-strategy unsafe-best-match
# then install the rest of this file. `bash install.sh` does exactly that.
dependencies = [
    "accelerate==1.15.0",
    "annotated-doc==0.0.5",
    "anyio==4.15.1",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "click==8.5.0",
    "cloudpickle==3.1.2",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.32.0",
    "idna==3.20",
    "jinja2==3.1.6",
    "joblib==1.6.0",
    "loguru==0.7.3",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "narwhals==2.26.0",
    "networkx==3.6.1",
    "numpy==2.5.3",
    "nvidia-cublas-cu12==12.4.5.8",
    "nvidia-cuda-cupti-cu12==12.4.127",
    "nvidia-cuda-nvrtc-cu12==12.4.127",
    "nvidia-cuda-runtime-cu12==12.4.127",
    "nvidia-cudnn-cu12==9.1.0.70",
    "nvidia-cufft-cu12==11.2.1.3",
    "nvidia-curand-cu12==10.3.5.147",
    "nvidia-cusolver-cu12==11.6.1.9",
    "nvidia-cusparse-cu12==12.3.1.170",
    "nvidia-cusparselt-cu12==0.6.2",
    "nvidia-nccl-cu12==2.21.5",
    "nvidia-nvjitlink-cu12==12.4.127",
    "nvidia-nvtx-cu12==12.4.127",
    "packaging==26.3",
    "pandas==3.0.6",
    "psutil==7.2.2",
    "pyarrow==25.0.1",
    "pygments==2.21.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.9.10",
    "requests==2.34.2",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "setuptools==78.1.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy==1.13.1",
    "threadpoolctl==3.7.0",
    "tokenizers==0.23.2",
    "torch==2.6.0+cu124",
    "tqdm==4.70.1",
    "transformers==5.17.0",
    "triton==3.2.0",
    "typer==0.27.2",
    "typing-extensions==4.16.0",
    "urllib3==2.8.0",
]

[project.urls]
readme = "README.md"

[tool.uv]
# The nvidia-* and triton wheels come in with torch from the CUDA 12.4 index.
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
