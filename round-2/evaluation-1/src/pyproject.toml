[project]
name = "iter2-eval-reaudit"
version = "1.0.0"
description = "Re-checking the numbers we already have: a zero-GPU, zero-API re-adjudication (M0-M8) of iteration 1's three lanes, computed only from files already on disk."
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "loguru==0.7.3",
    "pyyaml==6.0.3",
    "tabulate==0.10.0",
]

[project.scripts]
eval-reaudit = "eval:main"

[tool.setuptools]
packages = ["evalkit"]
py-modules = ["eval"]
