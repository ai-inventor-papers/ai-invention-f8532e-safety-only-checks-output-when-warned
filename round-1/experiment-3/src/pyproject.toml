[project]
name = "lane-c-safety-payoff"
version = "0.1.0"
description = "LANE C: does an activation-only single-model safety readout predict real safety across model families? (leave-one-family-out test S3)"
requires-python = ">=3.12"
# Versions pinned to exactly what the .venv used for the run (reproducibility).
# NOTE: microsoft/Phi-4-mini-instruct's trust_remote_code modeling file is
# incompatible with transformers 5.x, so the two Phi checkpoints were harvested
# under a separate .venv_phi pinned to transformers==4.53.3 (see method_out.json
# metadata.deviations); every other checkpoint used transformers==5.17.0 below.
dependencies = [
    "torch==2.6.0",
    "transformers==5.17.0",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "huggingface-hub==1.32.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "loguru==0.7.3",
    "requests==2.34.2",
    "aiohttp==3.14.3",
    "tenacity==9.1.4",
    "pyarrow==25.0.1",
]

[tool.lane-c.phi-subenv]
# separate environment used ONLY for the two Phi-4-mini checkpoints
transformers = "4.53.3"
