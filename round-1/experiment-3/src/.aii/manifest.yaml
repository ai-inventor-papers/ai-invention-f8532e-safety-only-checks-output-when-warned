# Keep/delete decisions for large binary / cache paths in this workspace.
# Text and code files, and anything under the auto-keep floor, need no entry.
# The scientific outputs (results/per_ckpt, results/sealed, results/s3, assets/,
# method_out.json + variants, prereg.json) are small text/JSON and are kept by default.
entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124 --index-strategy unsafe-best-match && uv pip install --python=.venv/bin/python transformers==5.17.0 accelerate==1.15.0 safetensors==0.8.0 huggingface-hub==1.32.0 numpy==2.5.3 scipy==1.18.1 pandas==3.0.6 scikit-learn==1.9.1 loguru==0.7.3 requests==2.34.2 aiohttp==3.14.3 tenacity==9.1.4 pyarrow==25.0.1"

  - path: .venv_phi/
    delete: regenerable
    source: "uv venv .venv_phi --python=3.12 && uv pip install --python=.venv_phi/bin/python torch==2.6.0 --index-url https://download.pytorch.org/whl/cu124 --index-strategy unsafe-best-match && uv pip install --python=.venv_phi/bin/python transformers==4.53.3 accelerate safetensors huggingface_hub numpy scipy scikit-learn loguru requests aiohttp   # transformers<5 ONLY for the two Phi-4-mini checkpoints"

  - path: __pycache__/
    delete: regenerable
    source: "python bytecode cache; regenerated automatically on next import of the lc_*.py / method.py modules"
