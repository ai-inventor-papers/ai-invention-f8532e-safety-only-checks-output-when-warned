entries:
  - path: .venv/
    delete: regenerable
    source: "./install.sh   (uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python --extra-index-url https://download.pytorch.org/whl/cpu --index-strategy unsafe-best-match -r pyproject.toml)"
  - path: harvest/*/gram/
    delete: regenerable
    source: "uv run method.py --stages wsummary randinit_w   (per-layer Gram of [o_proj|down_proj], zero prompts, re-derived from the HF snapshots)"
  - path: harvest/*/D_resp_parts/
    delete: regenerable
    source: "uv run method.py --stages csweep   (teacher-forced C-harvest; per-position tensor stored as <=90 MiB parts; X5 values are already in results/ and method_out.json)"
  - path: harvest/*/A_prompt.npy
    keep: last-prompt-token hidden states at every layer for 25 checkpoints - hours of single-core CPU forward passes, the substrate of every activation readout
  - path: harvest/*/A_resp.npy
    keep: window-pooled response-site states of the 96 teacher-forced cells (X11, response-site rows); small and CPU-expensive to regenerate
  - path: harvest/*/S_U.npy
    keep: unembedding second moment used by the closed-form X3 nulls; small
  - path: src/__pycache__/
    delete: regenerable
    source: "regenerated automatically by Python on the next import of any module in src/ (e.g. uv run method.py --stages t1)"
