entries:
  - path: .venv_gpu/
    delete: regenerable
    source: "bash restore.sh gpu   # uv venv --python 3.12 .venv_gpu + uv pip install -r env/requirements_gpu.txt (torch 2.9.1+cu128, transformers 5.17)"
  - path: .venv_ams/
    delete: regenerable
    source: "bash restore.sh ams   # uv venv --python 3.12 .venv_ams + uv pip install 'ams-scanner[cli]==0.1.3' 'torch==2.9.1+cpu'"
  - path: cache/
    delete: regenerable
    source: "rebuilt on demand by src/tierA.py / src/bars_partial.py (band-mean and bars-shim caches; cache/reharvest_check is the external-mode validation copy)"
  - path: results/confirm_harvest/
    delete: regenerable
    source: "uv run --python .venv_gpu/bin/python src/confirm_harvest_all.py   # our own 27-file harvest of the held-out checkpoints (the scored values are kept in results/confirm/ckpt_*.json)"
  - path: hf_cache/
    delete: redownloadable
    source: "empty by design: this artifact used the run's shared HF cache ($HF_HOME); every model is re-downloadable from the Hub by the repo id recorded in each meta.json"
  - path: results/screen/
    keep: 42 GPU intervention batteries + 54 array-only screens with their per-item arrays; the frozen screen the paper rests on (the rest of results/ is small JSON: the hashed chain, audits and tables)
  - path: logs/
    keep: run logs, the S3 open() audit that proves no outcome was read before the freeze, and the pre-reissue hash chain
