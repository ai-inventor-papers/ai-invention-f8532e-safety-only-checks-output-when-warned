# Only heavy paths get a decision here. This artifact downloads nothing and
# trains nothing: it reads iteration 1's read-only lane workspaces and writes
# only text, CSV, JSON and Markdown. Everything it produces (results/,
# eval_out.json, EVAL_REPORT.md, scratch/, logs/) is text under the auto-keep
# floor and is kept automatically, so none of it is listed.
entries:
  - path: .venv/
    delete: redownloadable
    source: "./install.sh   (equivalently: uv venv .venv --python=3.12 && VIRTUAL_ENV=$PWD/.venv uv pip install -r requirements.txt)"
  - path: __pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall eval.py"
  - path: evalkit/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall evalkit"
