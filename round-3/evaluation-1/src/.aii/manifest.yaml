entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && VIRTUAL_ENV=$PWD/.venv uv pip install numpy scipy scikit-learn pandas loguru tabulate matplotlib"
  - path: src/__pycache__/
    delete: regenerable
    source: "created automatically by running any src/*.py with the .venv interpreter"
