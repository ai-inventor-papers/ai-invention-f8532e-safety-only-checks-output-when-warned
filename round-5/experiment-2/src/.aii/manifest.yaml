# Disposition of every heavy path left in this workspace. Exactly one decision each.
# Text and code files at any size, and anything under the 10 MB auto-keep floor, need no entry.
# private/ (5.6 GB of raw completions on harmful prompts + edited weights) and src/__pycache__
# were already DELETED by logs/finalize.sh, so they are not listed.
entries:
  - path: arrays/
    keep: >-
      THE DELIVERABLE. 8.1 GB of per-layer activations, per-checkpoint direction banks and the
      forward-only intervention grid for 29 gated checkpoints (20 panel + 9 in-house arms),
      ~17k files each listed with shape, dtype and sha256. Six GPU-hours of work and NOT
      reproducible inside this run: every checkpoint's Hugging Face snapshot is deleted after
      its visit, and the in-house arms' edited weights lived in the deleted private/.

  - path: .venv_gpu/
    delete: regenerable
    source: "bash logs/build_venv.sh   # uv venv --python 3.12 .venv_gpu && uv pip install --python .venv_gpu/bin/python --extra-index-url https://download.pytorch.org/whl/cu128 --index-strategy unsafe-best-match -r env/requirements_gpu.txt"
