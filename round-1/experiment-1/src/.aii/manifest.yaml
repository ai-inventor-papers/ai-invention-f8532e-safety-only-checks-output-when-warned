entries:
  - path: .venv/
    delete: redownloadable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python torch==2.6.0+cu124 --index-url https://download.pytorch.org/whl/cu124 --index-strategy unsafe-best-match && uv pip install --python=.venv/bin/python -r requirements.txt   (or simply: bash install.sh)"

  - path: harvest/
    delete: regenerable
    source: ".venv/bin/python method.py --stage harvest   # 9.6 GB of pooled residual vectors and per-position projections for 7 checkpoints, written as <100 MB row shards (lane_a/shard.py); rebuilt in ~20 min on one 20 GB GPU from the pinned panel (restore the models first with .venv/bin/python prefetch.py)"

  - path: __pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall method.py run_analysis.py rebuild_outputs.py prefetch.py   # Python also recreates these automatically on the next import"

  - path: lane_a/__pycache__/
    delete: regenerable
    source: ".venv/bin/python -m compileall lane_a   # Python also recreates these automatically on the next import"

  - path: items/
    keep: the pinned input corpora whose SHA-256s are recorded in the hash-frozen prereg, so the substrate stays auditable byte-for-byte
