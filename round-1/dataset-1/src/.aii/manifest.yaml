# One decision per heavy path. Text/code/JSON/CSV/log/markdown files need no
# entry at any size, and neither does anything under the 10 MB auto-keep floor.
entries:
  - path: .venv/
    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python=.venv/bin/python datasets huggingface_hub transformers pandas numpy requests aiohttp loguru tenacity scipy jinja2"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "regenerated automatically by any python run of src/*.py"
